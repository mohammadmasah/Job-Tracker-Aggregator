name: Standalone downloads
on:
  workflow_dispatch:
    inputs:
      verify_release:
        description: 'Existing release tag to verify without rebuilding (leave empty for a full build)'
        required: false
        default: ''
        type: string
  push:
    tags: ['v*']
    paths:
      - 'desktop/**'
      - '.github/workflows/standalone.yml'
permissions:
  contents: read
jobs:
  build:
    if: github.event.inputs.verify_release == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x64
            executable: desktop/dist/TrackIt/TrackIt
          - os: windows-latest
            label: windows-x64
            executable: desktop/dist/TrackIt/TrackIt.exe
          - os: macos-15
            label: macos-arm64
            executable: desktop/dist/TrackIt.app/Contents/MacOS/TrackIt
          - os: macos-15-intel
            label: macos-x64
            executable: desktop/dist/TrackIt.app/Contents/MacOS/TrackIt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt pyinstaller==6.22.3
      - run: python -m unittest discover -s desktop -p "test_*.py"
      - run: python -m unittest discover -s backend/tests
        env:
          PYTHONPATH: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_STANDALONE: '1'
      - run: python desktop/build.py
      - run: python desktop/smoke.py "${{ matrix.executable }}"
      - run: python desktop/archive.py "${{ matrix.label }}"
      - run: python desktop/smoke_update.py "${{ matrix.executable }}"
      - uses: actions/upload-artifact@v4
        with:
          name: TrackIt-${{ matrix.label }}
          path: desktop/artifacts/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish tested downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: python desktop/publish.py "$TAG" downloads

  verify-release:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.verify_release != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python -m unittest discover -s desktop -p test_publish.py
      - name: Verify published downloads using the same publication logic
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.verify_release }}
        run: python desktop/publish.py "$TAG" downloads
