<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: 320px;
    }
  </style>
</head>
<body class="bg-white text-slate-800 p-3 font-sans antialiased selection:bg-blue-100">

  <div class="bg-slate-50/80 border border-slate-200/90 rounded-2xl p-4 text-center shadow-sm">
    

    <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-200/60 px-1">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 bg-blue-600/10 text-blue-600 rounded-lg flex items-center justify-center">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div class="text-left">
          <h3 class="text-sm font-semibold text-slate-900 leading-none">Job Tracker</h3>
          <span class="text-[10px] font-medium text-slate-400">Extension Chrome</span>
        </div>
      </div>

    </div>

    <button id="saveBtn" class="w-full bg-[#0b57d0] hover:bg-[#0842a0] active:scale-[0.99] text-white font-medium text-xs py-2.5 px-4 rounded-full transition-all duration-150 flex items-center justify-center gap-2 shadow-sm cursor-pointer">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"></path>
      </svg>
      <span>Enregistrer dans le Dashboard</span>
    </button>

    <div id="status" class="mt-3 text-center text-xs font-medium text-slate-500 min-h-[16px] leading-relaxed break-words"></div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
