name: Chatbot CI

on: [push]

jobs:
  test-chatbot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LangChain
        run: pip install langchain-core

      - name: Test Chatbot Imports
        run: python -c "import langchain_core; print('Chatbot dependencies loaded successfully!')"