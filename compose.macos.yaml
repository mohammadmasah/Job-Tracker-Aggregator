# Run with: docker compose -f docker-compose.yml -f compose.macos.yaml up -d
# Start native Ollama first: brew services start ollama
services:
  backend:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_HOST: http://host.docker.internal:11434
    depends_on:
      ollama: !reset null
  ollama:
    profiles: [container-ollama]
